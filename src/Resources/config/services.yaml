services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Tourze\TrainInstitutionBundle\Controller\:
    resource: '../../Controller/'
  Tourze\TrainInstitutionBundle\Repository\:
    resource: '../../Repository/'
  Tourze\TrainInstitutionBundle\Service\:
    resource: '../../Service/'
    public: true
  Tourze\TrainInstitutionBundle\Command\:
    resource: '../../Command/'

  # Repository interface aliases
  Tourze\TrainInstitutionBundle\Contract\InstitutionFacilityRepositoryInterface:
    alias: Tourze\TrainInstitutionBundle\Repository\InstitutionFacilityRepository
  Tourze\TrainInstitutionBundle\Contract\InstitutionQualificationRepositoryInterface:
    alias: Tourze\TrainInstitutionBundle\Repository\InstitutionQualificationRepository
  Tourze\TrainInstitutionBundle\Contract\InstitutionChangeRecordRepositoryInterface:
    alias: Tourze\TrainInstitutionBundle\Repository\InstitutionChangeRecordRepository
  Tourze\TrainInstitutionBundle\Contract\InstitutionRepositoryInterface:
    alias: Tourze\TrainInstitutionBundle\Repository\InstitutionRepository
